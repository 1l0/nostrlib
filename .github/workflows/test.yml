name: Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: |
          # すべてのパッケージを取得し除外
          PKGS=$(go list ./... | grep -v \
            -e 'fiatjaf.com/nostr/schema' \
            -e 'fiatjaf.com/nostr/nip29' \
            -e 'fiatjaf.com/nostr/khatru' \
            -e 'fiatjaf.com/nostr/sdk')
          go test $PKGS

  test-wasm-go:
    name: Go WASM Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest

      - name: Disable AppArmor Chrome restriction
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install wasmbrowsertest
        run: |
          go install github.com/agnivade/wasmbrowsertest@latest
          mv $(go env GOPATH)/bin/wasmbrowsertest $(go env GOPATH)/bin/go_js_wasm_exec

      - name: Run GOOS=js WASM tests
        run: |
          WASM_PKGS=(
            "."
            "./nip04"
            "./nip05"
            "./nip06"
            "./nip10"
            "./nip11"
            "./nip13"
            "./nip14"
            "./nip17"
            "./nip19"
            "./nip22"
            "./nip23"
            "./nip27"
            "./nip31"
            "./nip34"
            "./nip40"
            "./nip42"
            "./nip44"
            "./nip46"
            "./nip49"
            "./nip52"
            "./nip53"
            "./nip54"
            "./nip57"
            "./nip59"
            "./nip60"
            "./nip60/client"
            "./nip61"
            "./nip65"
            "./nip70"
            "./nip73"
            "./nip77"
            "./nip77/negentropy"
            "./nip86"
            "./nip92"
            "./nip94"
          )
          GOOS=js GOARCH=wasm go test -short "${WASM_PKGS[@]}"

  test-wasm-tinygo:
    name: TinyGo WASM Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install TinyGo
        run: |
          wget -q https://github.com/tinygo-org/tinygo/releases/download/v0.40.1/tinygo_0.40.1_amd64.deb
          sudo dpkg -i tinygo_0.40.1_amd64.deb

      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest

      - name: Disable AppArmor Chrome restriction
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install wasmbrowsertest
        run: |
          go install github.com/agnivade/wasmbrowsertest@latest
          mv $(go env GOPATH)/bin/wasmbrowsertest $(go env GOPATH)/bin/go_js_wasm_exec

      - name: Run TinyGo WASM tests
        run: |
          WASM_PKGS=(
            "."
            "./nip04"
            "./nip05"
            "./nip06"
            "./nip10"
            "./nip11"
            "./nip13"
            "./nip14"
            "./nip17"
            "./nip19"
            "./nip22"
            "./nip23"
            "./nip27"
            "./nip31"
            "./nip34"
            "./nip40"
            "./nip42"
            "./nip44"
            "./nip46"
            "./nip49"
            "./nip52"
            "./nip53"
            "./nip54"
            "./nip57"
            "./nip59"
            "./nip60"
            "./nip60/client"
            "./nip61"
            "./nip65"
            "./nip70"
            "./nip73"
            "./nip77"
            "./nip77/negentropy"
            "./nip86"
            "./nip92"
            "./nip94"
          )
          GOOS=js GOARCH=wasm tinygo test -short "${WASM_PKGS[@]}"
